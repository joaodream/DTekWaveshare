[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtekwaveshare"
version = "0.1.0"
description = "Foundation toolkit for Waveshare ETH relay orchestration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Joao Oliveira" }
]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
dtek-waveshare = "dtekwaveshare.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
